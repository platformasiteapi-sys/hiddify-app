<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Клип: вся область холста МИНУС форма зазора (сдвинутая молния).
         Использует clip-rule="evenodd": внешний прямоугольник задаёт видимую зону,
         внутренний полигон вырезает из неё дырку -->
    <clipPath id="notch" clip-rule="evenodd">
      <path d="M 0,0 H 64 V 64 H 0 Z
               M 42.86,4 L 31.43,34.86 L 39.14,34.86 L 34.86,60 L 57.71,25.14 L 48,25.14 L 54.86,4 Z"/>
    </clipPath>
  </defs>

  <g fill="#5E56F3">
    <!-- Три нижних столбца — без клипа, молния их не касается -->
    <rect x="6.29"  y="37.71" width="6.29" height="17.14"/>
    <rect x="15.43" y="29.14" width="6.29" height="25.71"/>
    <rect x="24.57" y="20.57" width="6.29" height="34.29"/>

    <!-- Четвёртый столбец с вырезом под зазор молнии -->
    <rect x="33.71" y="12" width="6.29" height="42.86" clip-path="url(#notch)"/>

    <!-- Молния -->
    <polygon points="45.14,6.29 33.71,34.86 41.43,34.86 37.14,57.71 57.14,26.29 48,26.29 54.29,6.29"/>
  </g>
</svg>
